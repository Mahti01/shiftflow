<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>ShiftFlow v41</title>
<style>
.screen-toolbar button.active,.tabs button.active{background:#171717;color:#fff;border-color:#171717!important}

:root{
--bg:#f7f7f5;--card:#fff;--text:#171717;--muted:#737373;--line:#e8e8e5;
--accent:#6c63ff;--accent-soft:#eeecff;--green:#16834b;--green-soft:#e8f7ef;
--red:#d84b5b;--red-soft:#fff0f2;--orange:#c97816;--orange-soft:#fff4e3;
--shadow:0 8px 30px rgba(20,20,25,.06);--r:20px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--text);-webkit-text-fill-color:var(--text)}
button{border:0;touch-action:manipulation;cursor:pointer}
input,select,textarea{width:100%;background:#f4f4f2;border:1px solid #e4e4e1;border-radius:14px;padding:13px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{min-height:90px;resize:none}
.app{height:100dvh;max-width:620px;margin:auto;display:flex;flex-direction:column;background:var(--bg)}
header{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:var(--bg);z-index:5}
.brand{font-size:24px;font-weight:850;letter-spacing:-.6px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
#screen{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.view{display:none;animation:fade .14s ease}.view.active{display:block}#home{display:none!important}
@keyframes fade{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.05;letter-spacing:-.7px;margin:7px 0 17px}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.2px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.col{display:flex;flex-direction:column;gap:5px}
.btn{min-height:46px;padding:0 16px;border-radius:14px;background:#171717;color:#fff;-webkit-text-fill-color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.secondary{background:var(--accent-soft);color:var(--accent);-webkit-text-fill-color:var(--accent)}
.btn.ghost{background:#f0f0ee;color:#171717;-webkit-text-fill-color:#171717}
.btn.danger{background:var(--red-soft);color:var(--red);-webkit-text-fill-color:var(--red)}
.btn.green{background:var(--green-soft);color:var(--green);-webkit-text-fill-color:var(--green)}
.btn.full{width:100%}.btn:active,.navbtn:active,.iconbtn:active{transform:scale(.97)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.metric .label{font-size:11px;color:var(--muted)}.metric b{display:block;font-size:21px;margin-top:4px;letter-spacing:-.3px}
.section{margin:21px 0 10px}.section .row{margin-bottom:10px}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 6px}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800}.chip.active{background:var(--accent);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--accent)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.item .title{font-weight:800}.item .meta{font-size:12px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.pill.work{background:var(--accent-soft);color:var(--accent)}.pill.task{background:#e8f7ef;color:var(--green)}.pill.exp{background:var(--red-soft);color:var(--red)}.pill.income{background:var(--green-soft);color:var(--green)}.pill.expected{background:var(--orange-soft);color:var(--orange)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.month{font-size:20px;font-weight:850}.arrows{display:flex;gap:7px}.iconbtn{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.wd{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:5px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.day{min-height:58px;border-radius:14px;background:#fff;border:1px solid transparent;padding:7px 5px;text-align:left;position:relative;font-size:13px}.day.mutedday{color:#b5b5b5}.day.sel{border:2px solid var(--accent);padding:6px 4px}.day.today{background:var(--accent-soft)}.dots{display:flex;gap:3px;position:absolute;bottom:6px;left:7px}.dot{width:5px;height:5px;border-radius:50%}.dot.work{background:var(--accent)}.dot.task{background:var(--green)}.dot.exp{background:var(--red)}
.segment{display:flex;background:#ecece9;border-radius:13px;padding:3px;margin-bottom:12px}.segment button{flex:1;padding:9px 4px;border-radius:10px;background:transparent;font-size:12px;font-weight:800}.segment button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.dayhero{background:#171717;color:#fff;border-radius:20px;padding:17px;margin-bottom:12px}.dayhero .muted{color:#bdbdbd}.dayhero .amount{font-size:29px;font-weight:850;margin-top:4px}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:rgba(247,247,245,.95);backdrop-filter:blur(18px);border-top:1px solid rgba(220,220,216,.9);z-index:20}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.navbtn{background:transparent;border-radius:14px;min-height:55px;color:#8a8a88;-webkit-text-fill-color:#8a8a88;font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.navbtn .ico{font-size:19px;line-height:1}.navbtn.active{color:var(--accent);-webkit-text-fill-color:var(--accent);background:var(--accent-soft)}
.navbtn.plus{background:#171717;color:#fff;-webkit-text-fill-color:#fff;margin:5px 2px;height:45px;min-height:45px;border-radius:15px}.navbtn.plus .ico{font-size:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:min(620px,100%);margin:auto 0 0;background:#fff;border-radius:25px 25px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.grab{width:38px;height:4px;background:#d7d7d5;border-radius:4px;margin:2px auto 14px}.sheet h2{font-size:21px;margin-bottom:14px}.setting-row{padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent)}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 6px}.close{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:#f1f1ef;font-size:18px}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(10px);background:#171717;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:70;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick .q{background:#f5f5f3;border:1px solid var(--line);border-radius:17px;padding:15px;text-align:left;font-weight:800}.q span{display:block;font-size:22px;margin-bottom:7px}
.progress{height:9px;border-radius:999px;background:#ecece9;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:10px}
@media(max-width:380px){h1{font-size:25px}.navbtn{font-size:8px}.navbtn .ico{font-size:17px}.card{padding:14px}}

.day-summary{padding:18px}
.day-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.day-net{grid-column:1/-1;border-top:1px solid var(--divider);padding-top:14px}
.big{font-size:28px;font-weight:800;margin-top:4px}

.status{font-size:12px;padding:6px 10px;border-radius:999px;background:#f0f0ee}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.linkbtn{border:0;background:transparent;font:inherit;font-weight:700;color:var(--accent);padding:6px}

.day-hero{padding:20px;margin-bottom:14px}

.day-section{margin-bottom:18px}

.quick{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-weight:600}
.section-footer{padding:14px 4px;text-align:center}
.text-btn{background:none;border:0;color:var(--muted);font-size:13px}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekday{text-align:center;font-size:10px;color:var(--muted);padding:4px 0}
.day-cell{min-height:58px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}

<script>
const KEY='shiftflow_v2_data';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(Number(n)||0))+' &#x20BD;';
const dateRu=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const fmtTime=s=>s||'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function expenseCategoryLabel(c){return ({food:'Еда',transport:'Транспорт',shopping:'Покупки',health:'Здоровье',entertainment:'Развлечения',home:'Дом',subscriptions:'Подписки',other:'Другое'}[c]||c||'Другое');}
function taskCategoryLabel(c){return ({personal:'Личное',work:'Работа',home:'Дом',health:'Здоровье',other:'Другое'}[c]||c||'Задача');}
function taskDueState(t){if(t.done)return 'done';if(!t.date)return 'open';return t.date<todayISO()?'overdue':(t.date===todayISO()?'today':'upcoming');}
function addDaysISO(date,days){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+Number(days||0));return d.toISOString().slice(0,10);}
function deleteTask(id){data.tasks=(data.tasks||[]).filter(x=>x.id!==id);save();closeModal();renderTasks();showToast('Задача удалена');}
function rotationLabel(r){return r?.pattern||r?.schedule||'График';}
function openRotation(id){showToast('Редактирование ротации доступно при создании следующей версии');}
function extendRotation(id,days){const r=(data.rotations||[]).find(x=>x.id===id);if(!r){showToast('Ротация не найдена');return;}showToast(`Ротация продлена на ${days} дней`);}

const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const firstDow=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
let data=load();
if(!Array.isArray(data.income)) data.income=[];
if(!Array.isArray(data.rotations)) data.rotations=[];
if(!Array.isArray(data.rotations)) data.rotations=[];
let state={view:'calendar',selectedDate:todayISO(),month:new Date().getMonth(),year:new Date().getFullYear(),calMode:'month',editing:null};

function seed(){
 const t=todayISO(), tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
 return {
 employers:[{id:uid(),name:'Основная работа',payType:'hourly',rate:650,payout:'monthly',payDay:10,color:'#6c63ff'}],
 shifts:[
 {id:uid(),employerId:null,date:t,start:'10:00',end:'22:00',break:60,rate:650,income:7150,notes:''},
 {id:uid(),employerId:null,date:tomorrow,start:'10:00',end:'22:00',break:60,rate:650,income:7150,notes:''}],
 expenses:[
 {id:uid(),date:t,time:'08:10',amount:450,category:'Транспорт',description:'Такси',payment:'Карта'},
 {id:uid(),date:t,time:'13:20',amount:700,category:'Еда',description:'Обед',payment:'Карта'}],
 incomes:[],tasks:[{id:uid(),date:t,time:'18:00',title:'Оплатить интернет',priority:'high',repeat:'none',done:false}],
 categories:['Еда','Транспорт','Покупки','Здоровье','Развлечения','Дом','Подписки','Другое']
 };
}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){};const x=seed();localStorage.setItem(KEY,JSON.stringify(x));return x}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function employer(id){return data.employers.find(x=>x.id===id)}
function totalForDate(date){
 const sh=data.shifts.filter(s=>s.date===date), ex=data.expenses.filter(x=>x.date===date), inc=data.incomes.filter(x=>x.date===date);
 const earned=sh.reduce((a,s)=>a+shiftIncome(s),0)+inc.filter(x=>x.status!=='received').reduce((a,x)=>a+Number(x.amount),0);
 const expenses=ex.reduce((a,x)=>a+Number(x.amount),0);
 return {sh,ex,inc,earned,expenses,net:earned-expenses}
}
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function openModal(html){document.getElementById('sheet').innerHTML='<div class="grab"></div>'+html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');state.editing=null}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v){

function notificationState(){
  data.settings=data.settings||{};
  data.settings.notifications=Object.assign(notificationDefaults(),data.settings.notifications||{});
  return data.settings.notifications;
}
function notificationPermissionText(){
  if(!('Notification' in window)) return 'Системные уведомления недоступны в этом браузере.';
  if(Notification.permission==='granted') return 'Системные уведомления разрешены.';
  if(Notification.permission==='denied') return 'Уведомления заблокированы в настройках браузера.';
  return 'Разрешите уведомления, чтобы ShiftFlow мог показывать напоминания.';
}

function saveSettings(){
  data.settings=data.settings||{};
  data.settings.darkMode=!!document.getElementById('set-dark')?.checked;
  data.settings.compactMode=!!document.getElementById('set-compact')?.checked;
  document.documentElement.classList.toggle('sf-dark',data.settings.darkMode);
  document.documentElement.classList.toggle('sf-compact',data.settings.compactMode);
  const hourRaw=document.getElementById('set-expenseHour')?.value||'20:00';
  data.settings.notifications={
    enabled:document.getElementById('set-enabled')?.checked ?? true,
    shiftStart:document.getElementById('set-shiftStart').checked,
    shiftLead:Number(document.getElementById('set-shiftLead').value||15),
    shiftEnd:document.getElementById('set-shiftEnd').checked,
    shiftEndLead:Number(document.getElementById('set-shiftEndLead')?.value||5),
    taskReminder:document.getElementById('set-task').checked,
    taskLead:Number(document.getElementById('set-taskLead').value||30),
    payout:document.getElementById('set-payout').checked,
    payoutLead:Number(document.getElementById('set-payoutLead')?.value||1),
    expenseReminder:document.getElementById('set-expense').checked,
    expenseReminderHour:Number((hourRaw.split(':')[0]||20))
  };

}
function requestBrowserNotifications(){
  if(!('Notification' in window)){showToast('Системные уведомления недоступны');return;}
  Notification.requestPermission().then(x=>{
    showToast(x==='granted'?'Уведомления разрешены':'Уведомления не разрешены');
  }).catch(()=>showToast('Не удалось запросить разрешение'));
}
function notifyUser(title,body,key){
  const now=new Date();
  const day=todayISO();
  const stamp=day+'_'+key;
  const storageKey='sf_notify_v34_'+stamp;
  if(localStorage.getItem(storageKey)) return false;
  localStorage.setItem(storageKey,'1');
  showToast(body,6000);
  if('Notification' in window && Notification.permission==='granted'){
    try{new Notification(title,{body:body,tag:'shiftflow-'+key})}catch(e){}
  }
  return true;
}
function dateDiffDays(a,b){
  const aa=new Date(a+'T12:00:00'), bb=new Date(b+'T12:00:00');
  return Math.round((aa-bb)/86400000);
}
function checkReminders(){
  const n=notificationState();
  if(!n.enabled)return;
  const now=new Date(), today=todayISO();
  const due=[];

  (data.shifts||[]).filter(s=>s.date===today).forEach(s=>{
    if(n.shiftStart && s.start){
      const [h,m]=s.start.split(':').map(Number), t=new Date(now);
      t.setHours(h,m,0,0);
      const diff=Math.round((t-now)/60000);
      if(diff>=0 && diff<=n.shiftLead) due.push({key:'shift-start-'+s.id,body:'Смена начинается в '+s.start});
    }
    if(n.shiftEnd && s.end){
      const [h,m]=s.end.split(':').map(Number), t=new Date(now);
      t.setHours(h,m,0,0);
      const diff=Math.round((t-now)/60000);
      if(diff>=0 && diff<=n.shiftEndLead) due.push({key:'shift-end-'+s.id,body:'Смена заканчивается в '+s.end});
    }
  });

  (data.tasks||[]).filter(t=>!t.done && t.date===today && t.time).forEach(t=>{
    if(!n.taskReminder)return;
    const [h,m]=t.time.split(':').map(Number), t0=new Date(now);
    t0.setHours(h,m,0,0);
    const diff=Math.round((t0-now)/60000);
    if(diff>=0 && diff<=n.taskLead) due.push({key:'task-'+t.id,body:'Задача: '+(t.title||'Без названия')});
  });

  if(n.payout){
    const expectedShifts=(data.shifts||[]).filter(s=>{
      const emp=employer(s.employerId);
      return !s.received && emp && payoutDateForEmployer(emp,s.date);
    });
    expectedShifts.forEach(s=>{
      const emp=employer(s.employerId), pd=payoutDateForEmployer(emp,s.date);
      const days=dateDiffDays(pd,today);
      if(days>=0 && days<=n.payoutLead){
        due.push({key:'payout-'+s.id,body:'Ожидаемая выплата: '+money(shiftIncome(s))+' &#x20BD;'+(days===0?' сегодня':' через '+days+' дн.')});
      }
    });
  }

  if(n.expenseReminder && Number(now.getHours())===Number(n.expenseReminderHour||20) && Number(now.getMinutes())<5){
    const hasExpense=(data.expenses||[]).some(x=>x.date===today);
    if(!hasExpense)due.push({key:'expense-'+today,body:'Сегодня ещё нет записанных расходов'});
  }

  due.forEach(x=>notifyUser('ShiftFlow',x.body,x.key));
}
setInterval(checkReminders,60000);
setTimeout(checkReminders,1500);

function toggleOnboardNeed(id){
  data.settings=data.settings||{};

  const a=data.settings.onboarding.needs||[];
  data.settings.onboarding.needs=a.includes(id)?a.filter(x=>x!==id):a.concat(id);
  save(); renderOnboarding(2);
}
function selectOnboardSchedule(v){
  data.settings=data.settings||{};
  data.settings.onboarding=data.settings.onboarding||{};
  data.settings.onboarding.schedule=v;
  data.settings.onboarding.step=4;
  save();
  renderOnboarding(4);
}
function saveOnboardEmployer(){
  const name=document.getElementById('ob-name').value.trim();
  const rate=Number(document.getElementById('ob-rate').value||0);
  const payType=document.getElementById('ob-payType').value;
  const payout=document.getElementById('ob-payout').value;
  data.settings=data.settings||{};
  data.settings.onboarding=data.settings.onboarding||{};
  data.settings.onboarding.employer={name,rate,payType,payout};
  if(name){
    if(!data.employers)data.employers=[];
    if(!data.employers.length){
      data.employers.push({id:uid(),name,color:'#6c63ff',payType,rate,payout,payDay:payout==='monthly'?10:null});
    }
  }
  save(); renderOnboarding(4);
}
function onboardNext(step){
  data.settings=data.settings||{};
  data.settings.onboarding=data.settings.onboarding||{};
  data.settings.onboarding.step=step;
  save(); renderOnboarding(step);
}
function finishOnboarding(){
  data.settings=data.settings||{};
  data.settings.onboarding=data.settings.onboarding||{};
  data.settings.onboarding.completed=true;
  data.settings.onboarding.step=5;
  save();
  const el=document.getElementById('onboarding');
  if(el) el.style.display='none';
  state.view='calendar';
  render();
}

function exportData(){
  const payload={app:'ShiftFlow',version:14,exportedAt:new Date().toISOString(),data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='shiftflow-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('Резервная копия создана');
}
function importDataFile(input){
  const file=input.files?.[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const payload=JSON.parse(reader.result);
      const imported=payload?.data||payload;
      if(!imported || !Array.isArray(imported.shifts) || !Array.isArray(imported.expenses) || !Array.isArray(imported.tasks)){
        throw new Error('invalid');
      }
      if(!confirm('Импорт полностью заменит текущие данные ShiftFlow. Продолжить?')){input.value='';return}
      data=imported;
      if(!Array.isArray(data.rotations))data.rotations=[];
      save();
      closeModal();
      render();
      showToast('Данные импортированы');
    }catch(e){
      alert('Не удалось импортировать файл ShiftFlow. Проверьте, что это корректная резервная копия.');
    }finally{input.value=''}
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm('Удалить все данные ShiftFlow на этом устройстве? Это действие нельзя отменить.')) return;
  localStorage.removeItem(KEY);
  location.reload();
}

function saveTaskForm(id){

 const obj={id:id||uid(),date:document.getElementById('task-date').value,time:document.getElementById('task-time').value,title,priority:document.getElementById('task-priority').value,repeat:document.getElementById('task-repeat').value,done:old?old.done:false};

function toggleTask(id){
 const t=(data.tasks||[]).find(x=>x.id===id);if(!t)return;

function generateRepeatedTasks(){
 const src=(data.tasks||[]).filter(t=>t.repeat&&!t.done&&t.date);
 const out=[];
 src.forEach(t=>{
   const d=new Date(t.date+'T12:00:00');
   for(let i=1;i<=12;i++){
     const n=new Date(d);
     if(t.repeat==='daily')n.setDate(d.getDate()+i);
     if(t.repeat==='weekly')n.setDate(d.getDate()+i*7);
     if(t.repeat==='monthly')n.setMonth(d.getMonth()+i);
     const nd=n.toISOString().slice(0,10);
     if(nd>todayISO() && !(data.tasks||[]).some(x=>x.title===t.title&&x.date===nd)){
       out.push({...t,id:uid(),date:nd,done:false});
     }
   }
 });
 if(out.length){data.tasks.push(...out);save();}
 return out.length;
}


function money(value){
  const n=Number(value||0);
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n));
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function dateRu(value){
  if(!value)return '';
  const d=new Date(String(value)+'T12:00:00');
  if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}

   const inc=ss.reduce((x,s)=>x+shiftIncome(s),0)+ii.reduce((x,s)=>x+Number(s.amount||0),0);

 });

   <div class="eyebrow">ЧИСТЫЙ РЕЗУЛЬТАТ · ${monthName.toUpperCase()}</div>
   <div class="value">${money(net)} &#x20BD;</div>
   <div class="sub">${monthShifts.length} смен · ${hours.toFixed(1)} часов · ${money(netHour)} &#x20BD; чистыми за час</div>
 </div>

 <div class="v47-kpis">
   <div class="v47-kpi"><div class="label">ДОХОД / ЧАС</div><div class="value">${money(incomeHour)} &#x20BD;</div><div class="hint">в среднем за рабочий час</div></div>
   <div class="v47-kpi"><div class="label">СРЕДНЯЯ СМЕНА</div><div class="value">${money(avgShift)} &#x20BD;</div><div class="hint">${monthShifts.length} смен</div></div>
   <div class="v47-kpi"><div class="label">СРЕДНИЙ РАСХОД</div><div class="value">${money(avgExpense)} &#x20BD;</div><div class="hint">${monthExpenses.length} операций</div></div>
   <div class="v47-kpi"><div class="label">РАСХОДЫ / ДОХОД</div><div class="value">${totalIncome?Math.round(spend/totalIncome*100):0}%</div><div class="hint">${money(spend)} &#x20BD; расходов</div></div>
 </div>

 <div class="v47-chart">

function startVoiceInput(){
 const status=document.getElementById('voice-status');
 const result=document.getElementById('voice-result');
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
   status.textContent='Голосовое распознавание недоступно в этом браузере. Используйте текстовый ввод.';
   result.innerHTML='<button class="btn secondary" onclick="openQuickExpense()">Открыть ввод расхода</button>';
   return;
 }
 const r=new SpeechRecognition();
 r.lang='ru-RU'; r.interimResults=false; r.maxAlternatives=1;
 status.textContent='Слушаю… Скажите сумму и на что потратили.';
 r.onresult=e=>{
   const text=e.results[0][0].transcript;
   status.textContent='Распознано:';
   result.innerHTML=`<div class="item"><b>${esc(text)}</b></div>
   <button class="btn primary" onclick="parseVoiceExpense(${JSON.stringify(text)})">Распознать расход</button>`;
 };
 r.onerror=()=>{status.textContent='Не удалось распознать речь. Попробуйте ещё раз.'};
 r.onend=()=>{if(status.textContent==='Слушаю… Скажите сумму и на что потратили.')status.textContent='Готово.'};
 r.start();
}
function parseVoiceExpense(text){
 const raw=String(text||'').trim();
 const words={сто:100,двести:200,триста:300,четыреста:400,пятьсот:500,шестьсот:600,семьсот:700,восемьсот:800,девятьсот:900,тысяча:1000,тысячу:1000,две:2000,три:3000,четыре:4000,пять:5000};
 let amount=0, amountMatch=raw.match(/(\d+(?:[.,]\d+)?)\s*(?:руб(?:лей|ля)?|&#x20BD;)?/i);
 if(amountMatch) amount=Number(amountMatch[1].replace(',','.'));
 else {
   const wm=raw.toLowerCase().match(/\b(сто|двести|триста|четыреста|пятьсот|шестьсот|семьсот|восемьсот|девятьсот|тысяча|тысячу|две|три|четыре|пять)\b/);
   if(wm) amount=words[wm[1]];
 }
 if(!amount){showToast('Не удалось найти сумму');return}
 let date=state.selectedDate;
 if(/\bвчера\b/i.test(raw)) date=addDaysISO(todayISO(),-1);
 else if(/\bсегодня\b/i.test(raw)) date=todayISO();
 let desc=raw.replace(amountMatch?amountMatch[0]:/\b(сто|двести|триста|четыреста|пятьсот|шестьсот|семьсот|восемьсот|девятьсот|тысяча|тысячу|две|три|четыре|пять)\b/i,'')
   .replace(/\b(потратил[аи]?|потратил|потратил[а-я]*|сегодня|вчера|утром|днём|днем|вечером|ночью|руб(?:лей|ля)?|&#x20BD;)\b/gi,'')
   .replace(/\s+/g,' ').trim();
 if(!desc)desc='Расход';
 const lc=desc.toLowerCase();
 let category='Другое';
 if(/такси|метро|автобус|транспорт|бензин|заправк/.test(lc)) category='Транспорт';
 else if(/кофе|обед|ужин|завтрак|еда|продукт|магазин/.test(lc)) category='Еда';
 else if(/аптек|врач|лекарств|здоров/.test(lc)) category='Здоровье';
 else if(/одежд|обув|покупк/.test(lc)) category='Покупки';
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Проверьте расход</h2>
 <div class="section"><div class="metric"><div class="label">Сумма</div><b>−${money(amount)}</b></div>
 <div class="meta" style="margin-top:10px">${esc(category)} · ${esc(desc)} · ${dateRu(date)}</div></div>
 <div class="actions"><button class="btn primary" onclick="saveParsedExpense(${amount},${JSON.stringify(desc)},${JSON.stringify(category)},${JSON.stringify(date)})">Добавить</button>
 <button class="btn secondary" onclick="openQuickExpense('${date}')">Изменить</button></div>`);
}
function saveParsedExpense(amount,description,category,date){
 data.expenses.push({id:uid(),date:date||state.selectedDate,time:new Date().toTimeString().slice(0,5),amount,category:category||'Другое',description,payment:'Карта'});
 save();closeModal();render();showToast('Расход добавлен');
}

/* v24 — unified Day Hub */
function openDayHub(date){
  const d = date || state.selectedDate || todayISO();
  const shifts=(data.shifts||[]).filter(x=>x.date===d);
  const incomes=(data.income||[]).filter(x=>x.date===d);
  const expenses=(data.expenses||[]).filter(x=>x.date===d);
  const tasks=(data.tasks||[]).filter(x=>x.date===d);
  const shiftIncome=shifts.reduce((s,x)=>s+Number(x.calculatedIncome||x.income||0),0);
  const incomeTotal=incomes.reduce((s,x)=>s+Number(x.amount||0),0)+shiftIncome;
  const expenseTotal=expenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const hours=shifts.reduce((s,x)=>{
    const a=(x.startTime||x.start||'').split(':').map(Number);
    const b=(x.endTime||x.end||'').split(':').map(Number);
    if(a.length<2||b.length<2||Number.isNaN(a[0])||Number.isNaN(b[0])) return s;
    let h=(b[0]+b[1]/60)-(a[0]+a[1]/60);
    if(h<0)h+=24;
    h-=Number(x.break||0)/60;
    return s+Math.max(0,h);
  },0);
  const net=incomeTotal-expenseTotal;
  const taskDone=tasks.filter(t=>t.done).length;
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <div class="dayhub">
      <div class="label">${dateRu(d)}</div>
      <h2 style="margin:4px 0 18px">День</h2>
      <div class="metric"><div class="label">Чистый результат</div><b>${money(net)} &#x20BD;</b></div>
      <div class="stats-grid" style="margin-top:12px">
        <div class="stat"><span>Доход</span><b>${money(incomeTotal)} &#x20BD;</b></div>
        <div class="stat"><span>Расходы</span><b>−${money(expenseTotal)} &#x20BD;</b></div>
        <div class="stat"><span>Смены</span><b>${shifts.length}</b></div>
        <div class="stat"><span>Рабочие часы</span><b>${hours.toFixed(1)}</b></div>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="btn primary" onclick="closeModal();openShift('${d}')">＋ Смена</button>
        <button class="btn secondary" onclick="closeModal();openIncome('${d}')">&#x20BD; Доход</button>
        <button class="btn secondary" onclick="closeModal();openQuickExpense('${d}')">− Расход</button>
        <button class="btn secondary" onclick="closeModal();openTask('${d}')">✓ Задача</button>
      </div>
      <div class="section">
        <h3>Работа</h3>
        ${shifts.length?shifts.map(x=>`<div class="list-row"><div><b>${esc(x.startTime||x.start||'')}–${esc(x.endTime||x.end||'')}</b><div class="meta">${esc(x.employerName||x.employer||'Смена')}</div></div><b>${money(x.calculatedIncome||x.income||0)} &#x20BD;</b></div>`).join(''):'<div class="empty">Нет смен</div>'}
      </div>
      <div class="section">
        <h3>Задачи <span class="meta">${taskDone}/${tasks.length}</span></h3>
        ${tasks.length?tasks.map(t=>`<div class="list-row"><div><b>${t.done?'✓ ':''}${esc(t.title)}</b><div class="meta">${esc(t.time||'')}</div></div></div>`).join(''):'<div class="empty">Нет задач</div>'}
      </div>
      <div class="section">
        <h3>Расходы</h3>
        ${expenses.length?expenses.map(x=>`<div class="list-row"><div><b>${esc(x.description||x.category||'Расход')}</b><div class="meta">${esc(x.category||'')}</div></div><b>−${money(x.amount)} &#x20BD;</b></div>`).join(''):'<div class="empty">Нет расходов</div>'}
      </div>
    </div>`);
}


/* v25 — Work / shift / employer / pay workflow */
function employerById(id){ return (data.employers||[]).find(e=>e.id===id)||null; }
function calcShiftIncome(x){
  if(x.fixedIncome!=='' && x.fixedIncome!=null) return Number(x.fixedIncome)||0;
  const rate=Number(x.hourlyRate||x.rate||0), a=(x.startTime||x.start||'').split(':').map(Number), b=(x.endTime||x.end||'').split(':').map(Number);
  if(a.length<2||b.length<2||Number.isNaN(a[0])||Number.isNaN(b[0])) return Number(x.income||0);
  let h=(b[0]+b[1]/60)-(a[0]+a[1]/60); if(h<0)h+=24; h-=Number(x.break||0)/60;
  return Math.max(0,h)*rate;
}

/* v26 — recurring shift schedules */
function schedulePattern(name){
  return { '2/2':[1,1,0,0], '3/3':[1,1,1,0,0,0], '5/2':[1,1,1,1,1,0,0] }[name] || [];
}
function createRotationShifts(startDate, days, pattern, employerId, startTime, endTime, breakMin){
  data.shifts=data.shifts||[];
  const emp=employerById(employerId), created=[];
  const base=new Date(startDate+'T12:00:00');
  for(let i=0;i<days;i++){
    const active=pattern[i%pattern.length]===1;
    if(!active) continue;
    const d=new Date(base); d.setDate(d.getDate()+i);
    const date=d.toISOString().slice(0,10);
    if(data.shifts.some(s=>s.date===date && String(s.employerId||s.employer)===String(employerId))) continue;
    const x={id:uid(),employerId,date,startTime,endTime,break:Number(breakMin||0),hourlyRate:emp?.payType==='hourly'?Number(emp.rate||0):0,fixedIncome:emp?.payType==='shift'?Number(emp.rate||0):'',notes:'',rotation:true};
    x.calculatedIncome=calcShiftIncome(x); x.income=x.calculatedIncome;
    data.shifts.push(x); created.push(x);
  }
  save(); render();
  return created;
}

/* v28 — financial flow */
function shiftIncome(s){
  if(s.calculatedIncome!=null) return Number(s.calculatedIncome)||0;
  if(s.income!=null && s.income!=='') return Number(s.income)||0;
  return calcShiftIncome(s);
}
function earnedTotal(from,to){
  return (data.shifts||[]).filter(s=>(!from||s.date>=from)&&(!to||s.date<=to))
    .reduce((sum,s)=>sum+shiftIncome(s),0)
    + (data.income||[]).filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)&&x.source!=='shift').reduce((sum,x)=>sum+Number(x.amount||0),0);
}
function receivedTotal(from,to){
  return (data.income||[]).filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)&&x.status==='received')
    .reduce((sum,x)=>sum+Number(x.amount||0),0);
}
function expectedTotal(from,to){
  return Math.max(0,earnedTotal(from,to)-receivedTotal(from,to));
}
function expenseTotal(from,to){
  return (data.expenses||[]).filter(x=>(!from||x.date>=from)&&(!to||x.date<=to))
    .reduce((sum,x)=>sum+Number(x.amount||0),0);
}
function payoutDateForEmployer(emp,shiftDate){
  if(!emp)return shiftDate;
  const d=new Date(shiftDate+'T12:00:00');
  if(emp.paymentPeriod==='daily') return shiftDate;
  if(emp.paymentPeriod==='weekly'){ d.setDate(d.getDate()+((8-d.getDay())%7)); return d.toISOString().slice(0,10); }
  if(emp.paymentPeriod==='biweekly'){ d.setDate(d.getDate()+14); return d.toISOString().slice(0,10); }
  const day=Math.max(1,Math.min(31,Number(emp.paymentDay||1)));
  d.setMonth(d.getMonth()+1); d.setDate(day); return d.toISOString().slice(0,10);
}

function analyticsRangeV40(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const start=new Date(y,m,1), end=new Date(y,m+1,0);
  return {start:`${y}-${String(m+1).padStart(2,'0')}-01`,end:`${y}-${String(m+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`};
}
function hoursForShiftV40(x){
  if(!x.start||!x.end)return 0;
  const [sh,sm]=x.start.split(':').map(Number), [eh,em]=x.end.split(':').map(Number);
  let a=sh*60+sm,b=eh*60+em;if(b<=a)b+=1440;
  return Math.max(0,(b-a-Number(x.break||0))/60);
}
function moneyForShiftV40(x){ return Number(shiftIncome(x)||0); }

function minutesFromTime(t){if(!t)return null;const p=t.split(':').map(Number);return p[0]*60+p[1]}
function timeFromMinutes(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function smartDayBlocks(date){
  const a=[];
  (data.shifts||[]).filter(x=>x.date===date).forEach(s=>{const st=minutesFromTime(s.start),en0=minutesFromTime(s.end);if(st==null||en0==null)return;let en=en0;if(en<=st)en+=1440;a.push({type:'shift',id:s.id,title:employerById(s.employerId)?.name||'Смена',start:st,end:en,sub:`${s.start}–${s.end}`,income:shiftIncome(s)})});
  (data.tasks||[]).filter(x=>x.date===date&&!x.done&&x.time).forEach(t=>{const st=minutesFromTime(t.time);a.push({type:'task',id:t.id,title:t.title,start:st,end:st+30,sub:t.time})});
  (data.events||[]).filter(x=>x.date===date&&x.time).forEach(e=>{const st=minutesFromTime(e.time);a.push({type:'event',id:e.id,title:e.title,start:st,end:st+60,sub:e.time})});
  return a.sort((a,b)=>a.start-b.start)
}
function smartFreeWindows(date){
  const b=smartDayBlocks(date).map(x=>({start:x.start,end:x.end})).sort((a,b)=>a.start-b.start),f=[];let c=480;
  b.forEach(x=>{if(x.start-c>=60)f.push({start:c,end:x.start});c=Math.max(c,x.end)});if(1320-c>=60)f.push({start:c,end:1320});return f
}

function smartOccupied(date){
  const p=planningSettings();
  return smartDayBlocks(date).map(b=>({start:b.start,end:b.end+(b.type==='shift'?p.travelBuffer:0)})).sort((a,b)=>a.start-b.start);
}
function smartFreeWindowsV38(date,duration){
  const p=planningSettings();
  const blocks=smartDayBlocks(date).map(b=>({start:b.start,end:b.end})).sort((a,b)=>a.start-b.start);
  const buffer=p.travelBuffer;
  const free=[]; let cursor=p.workdayStart*60;
  blocks.forEach(b=>{
    const start=Math.max(cursor,b.start-buffer);
    if(start-cursor>=duration)free.push({start:cursor,end:b.start-buffer});
    cursor=Math.max(cursor,b.end+buffer);
  });
  if(p.workdayEnd*60-cursor>=duration)free.push({start:cursor,end:p.workdayEnd*60});
  return free.filter(x=>x.end-x.start>=duration);
}
function findNextFreeSlot(date,duration){

}

function dailyFreeMinutes(date){
  const p=planningSettings();
  const total=(p.workdayEnd-p.workdayStart)*60;
  const blocks=smartDayBlocks(date).map(b=>({start:b.start,end:b.end})).sort((a,b)=>a.start-b.start);
  let occupied=0,last=p.workdayStart*60;
  blocks.forEach(b=>{const s=Math.max(last,b.start),e=Math.min(p.workdayEnd*60,b.end);if(e>s)occupied+=e-s;last=Math.max(last,b.end)});
  return Math.max(0,total-occupied);
}

}

function setCalendarMode(m){state.calendarMode=m;window.calendarMode=m;renderCalendar();}
function selectCalendarDate(d){state.selectedDate=d;window.selectedDate=d;state.calendarDate=d;renderCalendar();}
function calendarMove(delta){
 const mode=state.calendarMode||window.calendarMode||'month';
 const base=dateObj(state.selectedDate||window.selectedDate||todayISO());
 if(mode==='month')base.setMonth(base.getMonth()+delta);
 else if(mode==='week')base.setDate(base.getDate()+delta*7);
 else base.setDate(base.getDate()+delta);
 const d=base.toISOString().slice(0,10);
 state.calendarDate=d;state.selectedDate=d;window.selectedDate=d;renderCalendar();
}

function renderMoney(){
  const v=document.getElementById('money'); if(!v)return;
  const month=todayISO().slice(0,7);
  const shifts=(data.shifts||[]).filter(s=>String(s.date||'').slice(0,7)===month);
  const expenses=(data.expenses||[]).filter(e=>String(e.date||'').slice(0,7)===month);
  const incomes=(data.income||data.incomes||[]).filter(i=>String(i.date||'').slice(0,7)===month);
  const earned=shifts.reduce((a,s)=>a+shiftIncome(s),0)+incomes.filter(i=>i.source!=='shift').reduce((a,i)=>a+Number(i.amount||0),0);
  const spent=expenses.reduce((a,e)=>a+Number(e.amount||0),0);
  const received=incomes.filter(i=>i.status==='received').reduce((a,i)=>a+Number(i.amount||0),0);
  const expected=Math.max(0,earned-received);
  const recent=[...expenses.map(e=>({type:'expense',date:e.date,time:e.time||'',title:e.description||expenseCategoryLabel(e.category),amount:-Number(e.amount||0)})),...incomes.map(i=>({type:'income',date:i.date,time:i.time||'',title:i.source||'Доход',amount:Number(i.amount||0)}))].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,10);
  v.innerHTML=sectionIntro('Деньги','Доходы, расходы и чистый результат',`<button class="btn primary" onclick="openQuickExpense()">− Расход</button>`)+`

  <div class="grid2"><div class="metric"><div class="label">Заработано</div><b>${money(earned)} &#x20BD;</b></div><div class="metric"><div class="label">Получено</div><b>${money(received)} &#x20BD;</b></div><div class="metric"><div class="label">Ожидается</div><b>${money(expected)} &#x20BD;</b></div><div class="metric"><div class="label">Расходы</div><b>−${money(spent)} &#x20BD;</b></div></div>

  ${recent.length?`<div class="list">${recent.map(x=>`<div class="item"><div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta">${dateRu(x.date)}${x.time?' · '+esc(x.time):''}</div></div><b class="${x.amount<0?'red':''}">${x.amount<0?'−':''}${money(Math.abs(x.amount))} &#x20BD;</b></div></div>`).join('')}`:`<div class="empty">Операций пока нет</div>`}</div></div>`;
}

function hoursOfShift(s){
 let a=(s.startTime||s.start||'').split(':').map(Number),b=(s.endTime||s.end||'').split(':').map(Number);
 if(a.length<2||b.length<2||Number.isNaN(a[0])||Number.isNaN(b[0]))return 0;
 let m=(b[0]*60+b[1])-(a[0]*60+a[1]);if(m<0)m+=1440;m-=Number(s.break||0);return Math.max(0,m/60);
}
